<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f85606">
    <title>Products| Lazada</title>
    <link href="./output.css" rel="stylesheet">

<body class="bg-white text-gray-950">
    <!-- nav -->
    <div id="nav"></div>

    <!-- <div class="text-xs tracking-wide">
        Product
    </div> -->

    <div class="mx-auto w-300 h-400  py-5 sm:py-7 ">
        <div class="grid grid-cols-6  h-full   ">
            <div class="w-full h-full ">a</div>

            <div class=" col-span-5 w-full h-full  ">
                <p class="text-2xl text-gray-950 ">MultiVitamins</p>

                <div class="flex">
                    <div class="w-full text-sm">20604 items found for "multivitamins"</div>

                    <div class="flex  text-black   px-3">
                        <div class="w-20">
                            <p class="text-sm">Sort by:</p>
                        </div>
                        <div class="px-2 ">
                            <button class="border border-black rounded-sm w-30 text-gray-950 px-2 text-sm "
                                value="Best Match">Best
                                Match</button>
                        </div>
                        <div class="flex ">
                            <svg xmlns="http://www.w3.org/2000/svg" width="1.5em" height="1.5em" viewBox="0 0 36 36">
                                <path d="M0 0h36v36H0z" fill="none" />
                                <rect width="12" height="12" x="4" y="4" fill="currentColor"
                                    class="clr-i-solid clr-i-solid-path-1" rx="2" ry="2" />
                                <rect width="12" height="12" x="20" y="4" fill="currentColor"
                                    class="clr-i-solid clr-i-solid-path-2" rx="2" ry="2" />
                                <rect width="12" height="12" x="4" y="20" fill="currentColor"
                                    class="clr-i-solid clr-i-solid-path-3" rx="2" ry="2" />
                                <rect width="12" height="12" x="20" y="20" fill="currentColor"
                                    class="clr-i-solid clr-i-solid-path-4" rx="2" ry="2" />
                                <path fill="none" d="M0 0h36v36H0z" />
                            </svg>
                            <svg xmlns="http://www.w3.org/2000/svg" width="1.5em" height="1.5em" viewBox="0 0 20 20">
                                <path d="M0 0h20v20H0z" fill="none" />
                                <path fill="currentColor"
                                    d="M2 19h16c.55 0 1-.45 1-1V2c0-.55-.45-1-1-1H2c-.55 0-1 .45-1 1v16c0 .55.45 1 1 1M4 3c.55 0 1 .45 1 1s-.45 1-1 1s-1-.45-1-1s.45-1 1-1m13 0v2H6V3zM4 7c.55 0 1 .45 1 1s-.45 1-1 1s-1-.45-1-1s.45-1 1-1m13 0v2H6V7zM4 11c.55 0 1 .45 1 1s-.45 1-1 1s-1-.45-1-1s.45-1 1-1m13 0v2H6v-2zM4 15c.55 0 1 .45 1 1s-.45 1-1 1s-1-.45-1-1s.45-1 1-1m13 0v2H6v-2z" />
                            </svg>
                        </div>

                    </div>
                </div>

                <div id="product-list" class="grid grid-cols-4 ">

                </div>
            </div>
        </div>
    </div>


    

    <!-- footer -->
    <div id="footer"></div>

    <script>
        async function include(id, url) {
            try {
                const res = await fetch(url);
                document.getElementById(id).innerHTML = await res.text();
            } catch (err) {
                console.error('Failed to load ' + url, err);
            }
        }

        include('nav', './components/nav.html');
        include('footer', './components/footer.html');
    </script>

    <script src="./js/product.js"></script>
</body>

</html>
